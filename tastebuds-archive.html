<button class="accordion subdued mt-16">
	<div class="accordion_header">
		<p>See all quotes and details</p>
		<svg class="accordion_icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
			<path d="M8 15L20 27L32 15" stroke-width="3.5" />
		</svg>
	</div>
	<div class="accordion_content">
		<div class="interview-quotes_grid-container tastebuds">
			<img alt="" class="interview-quotes_img-quotation-mark" src="assets/svg/quotation-mark.svg" loading="lazy" aria-hidden="true" />
			<div class="grid-container mt-0">
				<div class="interview-quotes_grid-item">
					<div>
						<p>Diners experience choice paralysis.</p>
					</div>
					<blockquote>
						<div class="blockquote_content">
							<p class="mb-8">I feel worried that I'm missing out on better options if I don't keep scrolling.</p>
							<div class="blockquote_author">
								<p class="blockquote_author-name">Participant #4</p>
							</div>
						</div>
					</blockquote>
				</div>
				<div class="interview-quotes_grid-item item-2">
					<div>
						<p>Existing tools lack personalization.</p>
					</div>
					<blockquote>
						<div class="blockquote_content">
							<p class="mb-8">If I had a magic wand, I’d want to receive suggested items that would suit my tastes.</p>
							<div class="blockquote_author">
								<img alt="Responsive Image" class="hide blockquote_author-image" src="assets/images/postup/interview-james.webp" loading="lazy" />
								<p>Participant #2</p>
							</div>
						</div>
					</blockquote>
				</div>
				<div class="interview-quotes_grid-item item-3">
					<div>
						<p>Diners don't know their cravings.</p>
					</div>
					<blockquote>
						<div class="blockquote_content">
							<p class="mb-8">If only there was a way you can put a criteria of what you’re craving to be given suggestions.</p>
							<div class="blockquote_author">
								<p class="blockquote_author-name">Participant #1</p>
							</div>
						</div>
					</blockquote>
				</div>
				<div class="interview-quotes_grid-item quote-flex-col item-5">
					<div>
						<p>Yelp and Google users face unreliable content that are often irrelevant and biased.</p>
					</div>
					<blockquote>
						<div class="blockquote_content">
							<p class="mb-8">
								To find something that's good, we have to trust reviews online right? Sometimes they're inflated, and sometimes they're not entirely truthful. There's just not enough
								data points out there. It's just difficult to gather and gauge what's truly good...
							</p>
							<div class="blockquote_author">
								<img alt="Responsive Image" aria-hidden="true" class="hide blockquote_author-image" src="assets/images/postup/interview-adam.png" loading="lazy" />
								<p>Participant #5</p>
							</div>
						</div>
					</blockquote>
				</div>
				<div class="interview-quotes_grid-item quote-flex-col">
					<div>
						<p>Diners value recommendations from friends and family the most.</p>
					</div>
					<img alt="Responsive Image" class="hide blockquote_author-image" src="assets/images/postup/interview-adam.png" loading="lazy" />
					<blockquote>
						<div class="blockquote_content">
							<p class="mb-8">
								I feel like especially for friends, if I kind of know what their normal taste is like... so I can kind of gauge what they expect already. If someone gives me a
								recommendation that means they went and they liked it, so the odds of me going and not liking it are not really big at all.
							</p>
							<div class="blockquote_author">
								<img alt="Responsive Image" class="hide blockquote_author-image" src="assets/images/postup/interview-adam.png" loading="lazy" />
								<p>Participant #3</p>
							</div>
						</div>
					</blockquote>
				</div>
			</div>
		</div>
	</div>
</button>
